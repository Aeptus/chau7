# Pin the Rust toolchain so the libraries in every build (local dev, local
# release, any other machine) come from the same compiler. Without this the
# compiler floated per machine, letting library behavior/ABI skew between
# release paths. Bump deliberately together with a full test pass.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
