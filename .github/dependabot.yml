version: 2
updates:
  - package-ecosystem: swift
    directory: /apps/chau7-macos
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: swift
    directory: /apps/chau7-ios/Chau7RemoteApp
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /services/chau7-relay
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /services/chau7-issues
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /services/chau7-remote
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /services/chau7-proxy
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /crates
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /apps/chau7-next
    schedule:
      interval: weekly
    groups:
      coordinated-gpui-version-updates:
        applies-to: version-updates
        patterns: ["gpui*"]
      coordinated-gpui-security-updates:
        applies-to: security-updates
        patterns: ["gpui*"]
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /tools/pentagi-mcp
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
