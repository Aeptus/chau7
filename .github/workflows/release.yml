name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_channel:
        description: Build an unsigned production dry run, or prepare a gated, signed production RC artifact.
        type: choice
        required: true
        default: production-dry-run
        options:
          - production-dry-run
          - rust-production-rc
      release_version:
        description: SemVer candidate version for the production RC (for example 0.6.0-rc.1).
        type: string
        required: true
        default: 0.6.0-rc.1
      migration_validation_acknowledgement:
        description: Type RUST_PRODUCTION_MIGRATION_VALIDATED only after the migration validation is complete.
        type: string
        required: true
        default: not-validated

permissions:
  contents: read

concurrency:
  group: chau7-release-and-tap
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve the release stage and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stage: ${{ steps.resolve.outputs.stage }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.11.1
      - name: Enable pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.11.2
      - name: Validate release quality policy
        run: pnpm quality:cloud-parity --include=quality-cloud-parity-required-workflows
      - name: Resolve stage and version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          CHANNEL: ${{ inputs.release_channel }}
          ACKNOWLEDGEMENT: ${{ inputs.migration_validation_acknowledgement }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "$EVENT_NAME" = push ]; then
            stage=stable
            version="${REF_NAME#v}"
          elif [ "$CHANNEL" = rust-production-rc ]; then
            stage=rc
            version="$RELEASE_VERSION"
            if [ "$REF" != 'refs/heads/main' ]; then
              echo '::error::Rust production RC preparation is allowed only from main.'
              exit 1
            fi
            if [ "$ACKNOWLEDGEMENT" != 'RUST_PRODUCTION_MIGRATION_VALIDATED' ]; then
              echo '::error::Confirm migration validation before preparing a Rust production RC.'
              exit 1
            fi
          else
            stage=dry-run
            version=0.0.0-dry-run
          fi
          if [[ ! "$version" =~ $semver ]]; then
            echo '::error::Release version must be a valid semantic version.'
            exit 1
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build the production bundle once
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: services/chau7-remote/go.mod
          cache-dependency-path: |
            services/chau7-remote/go.sum
            services/chau7-proxy/go.sum
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Add the production target
        run: rustup target add aarch64-apple-darwin
      - name: Build production bundle and receipt once
        working-directory: apps/chau7-next
        env:
          CHANNEL: production
          TARGET: aarch64-apple-darwin
          BUILD_MODE: fast
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          OUT_DIR: ${{ runner.temp }}/rust-production-candidate
          BUILD_METADATA_DIR: ${{ runner.temp }}/rust-production-candidate
          REQUIRE_REMOTE_AGENT: '1'
          REQUIRE_PROXY: '1'
        run: ./scripts/bundle-macos.sh
      - name: Preserve unsigned bundle for the signing job
        run: tar -cf "$RUNNER_TEMP/rust-production-candidate.tar" -C "$RUNNER_TEMP" rust-production-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-production-candidate-unsigned
          path: ${{ runner.temp }}/rust-production-candidate.tar
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Sign, notarize and publish the release
    needs: [preflight, build]
    if: needs.preflight.outputs.stage == 'stable' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      dmg_sha256: ${{ steps.checksums.outputs.dmg_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-production-candidate-unsigned
          path: ${{ runner.temp }}
      - name: Restore the exact built bundle
        run: tar -xf "$RUNNER_TEMP/rust-production-candidate.tar" -C "$RUNNER_TEMP"
      - name: Require release signing configuration
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release/require-signing-secrets.sh
      - name: Prepare isolated signing keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release/signing-keychain.sh setup
      - name: Sign and notarize the reused bundle
        env:
          RELEASE_STAGE: stable
          APP_PATH: ${{ runner.temp }}/rust-production-candidate/Chau7.app
          MANIFEST_PATH: ${{ runner.temp }}/rust-production-candidate/Chau7-Production-aarch64-apple-darwin-fast.json
          DIST_DIR: ${{ runner.temp }}/rust-production-release
          BUILD_NUMBER: ${{ github.run_number }}
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release/sign-rust-production.sh
      - name: Always remove signing material
        if: always()
        run: ./scripts/release/signing-keychain.sh cleanup
      - name: Verify checksums
        id: checksums
        working-directory: ${{ runner.temp }}/rust-production-release
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          echo "dmg_sha256=$(shasum -a 256 Chau7-AppleSilicon.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/rust-production-release/*.dmg
            ${{ runner.temp }}/rust-production-release/*.zip
            ${{ runner.temp }}/rust-production-release/*-build-manifest.json
            ${{ runner.temp }}/rust-production-release/SHA256SUMS.txt
      - name: Extract release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          ./scripts/extract-changelog "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          echo 'Developer ID signed and notarized.' >> "$RUNNER_TEMP/release-notes.md"
          echo 'Verify the attached SHA256SUMS.txt and provenance with gh attestation verify.' >> "$RUNNER_TEMP/release-notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/rust-production-release/Chau7-AppleSilicon.dmg
            ${{ runner.temp }}/rust-production-release/Chau7-AppleSilicon.zip
            ${{ runner.temp }}/rust-production-release/Chau7-AppleSilicon-build-manifest.json
            ${{ runner.temp }}/rust-production-release/SHA256SUMS.txt

  update-homebrew-tap:
    name: Update optional Homebrew tap
    needs: [preflight, publish]
    if: needs.publish.outputs.dmg_sha256 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Report optional tap skip
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo 'Optional Homebrew tap update skipped; HOMEBREW_TAP_TOKEN is not configured. Release assets are available directly.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: aeptus/homebrew-chau7
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: tap
      - name: Update cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SHA256: ${{ needs.publish.outputs.dmg_sha256 }}
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/chau7.rb << CASK
          cask "chau7" do
            version "$VERSION"
            sha256 "$SHA256"
            url "https://github.com/aeptus/chau7/releases/download/v#{version}/Chau7-AppleSilicon.dmg"
            name "Chau7"
            desc "See your coding agents, know what they cost, steer them from the outside"
            homepage "https://chau7.sh"
            depends_on macos: ">= :sonoma"
            depends_on arch: :arm64
            app "Chau7.app"
            zap trash: ["~/.chau7", "~/Library/Application Support/Chau7", "~/Library/Logs/Chau7.log", "~/Library/Logs/Chau7"]
          end
          CASK
      - name: Commit and push only changed cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        working-directory: tap
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/chau7.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update chau7 to $VERSION"
          # shellcheck disable=SC2016 # Expand the token only inside Git's credential helper.
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$HOMEBREW_TAP_TOKEN"; }; f' push

  rust-production-rc-sign:
    name: Sign, notarize, attest, and store RC artifact
    needs: [preflight, build]
    if: needs.preflight.outputs.stage == 'rc' && github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-production-candidate-unsigned
          path: ${{ runner.temp }}
      - name: Restore the exact built candidate
        run: tar -xf "$RUNNER_TEMP/rust-production-candidate.tar" -C "$RUNNER_TEMP"
      - name: Require release signing configuration
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release/require-signing-secrets.sh
      - name: Prepare isolated signing keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release/signing-keychain.sh setup
      - name: Sign and notarize the reused Rust candidate
        env:
          RELEASE_STAGE: rc
          APP_PATH: ${{ runner.temp }}/rust-production-candidate/Chau7.app
          MANIFEST_PATH: ${{ runner.temp }}/rust-production-candidate/Chau7-Production-aarch64-apple-darwin-fast.json
          DIST_DIR: ${{ runner.temp }}/rust-production-rc
          BUILD_NUMBER: ${{ github.run_number }}
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release/sign-rust-production.sh
      - name: Always remove signing material
        if: always()
        run: ./scripts/release/signing-keychain.sh cleanup
      - name: Verify candidate checksums
        working-directory: ${{ runner.temp }}/rust-production-rc
        run: shasum -a 256 -c SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/rust-production-rc/*.dmg
            ${{ runner.temp }}/rust-production-rc/*.zip
            ${{ runner.temp }}/rust-production-rc/*-build-manifest.json
            ${{ runner.temp }}/rust-production-rc/SHA256SUMS.txt
      - name: Explain artifact visibility
        run: echo 'This is a gated CI RC artifact only; it does not create a tag, GitHub Release, or Homebrew update.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-production-rc-${{ github.run_number }}
          path: ${{ runner.temp }}/rust-production-rc
          retention-days: 14
          if-no-files-found: error
