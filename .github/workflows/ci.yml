name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode with the iPhone 17 simulator
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare an iOS simulator for the selected Xcode
        run: node scripts/quality/ios-simulator.mjs

      - name: Enable pnpm
        run: corepack enable

      - name: Check workflow policy
        run: pnpm quality:cloud-parity --include=quality-cloud-parity-required-workflows

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/chau7-remote/go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare pinned Rust toolchain and iOS targets
        working-directory: apps/chau7-macos/rust
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Install full-suite quality tools
        run: brew install swiftformat swiftlint gitleaks shellcheck ruff golangci-lint periphery pip-audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install jscpd
        run: npm install --global jscpd

      - name: Verify full-suite audit tooling
        run: |
          cargo deny --version
          pip-audit --version

      - name: Prepare Python test prerequisites
        run: |
          python3 -m venv "$RUNNER_TEMP/chau7-test-python"
          "$RUNNER_TEMP/chau7-test-python/bin/pip" install -r scripts/requirements-tests.txt
          echo "CHAU7_TEST_PYTHON=$RUNNER_TEMP/chau7-test-python/bin/python3" >> "$GITHUB_ENV"

      - name: Run affected and full-suite quality gates
        run: pnpm quality:prepush

      - name: Stage the pull request diff for staged gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The checkout is the PR snapshot. Move only HEAD to its base so
          # git diff --cached sees that snapshot instead of an empty diff.
          echo "CHAU7_CI_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          git reset --soft "$BASE_SHA"
          staged_tree="$(git write-tree)"
          if [ "$staged_tree" != "$expected_tree" ]; then
            echo "Staging the pull request diff did not reproduce the checked-out tree." >&2
            exit 1
          fi

      - name: Run staged quality gates
        env:
          CHAU7_PRE_COMMIT_REVIEW_ENABLED: "0"
        run: pnpm quality:staged

      - name: Verify staged gates did not rewrite the pull request
        run: |
          expected_tree="$(git rev-parse "${CHAU7_CI_HEAD}^{tree}")"
          staged_tree="$(git write-tree)"
          if [ "$staged_tree" != "$expected_tree" ]; then
            echo "A staged quality gate rewrote the pull request. Commit its formatting changes and rerun CI." >&2
            exit 1
          fi
          git diff --exit-code

      - name: Restore the checked-out commit after staged gates
        if: always() && env.CHAU7_CI_HEAD != ''
        run: git reset --soft "$CHAU7_CI_HEAD"

      - name: Show quality diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for quality_log in .aeptus-cache/quality/outputs/*.log; do
            [ -f "$quality_log" ] || continue
            echo "::group::$quality_log"
            cat "$quality_log"
            echo "::endgroup::"
          done
