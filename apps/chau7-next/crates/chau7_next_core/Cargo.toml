[package]
name = "chau7_next_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Explicit opt-in for production packaging; beta builds remain isolated.
production = []

[dependencies]
ondine = { package = "compiler", git = "https://github.com/wevm/ondine", rev = "6a1586e5af980e67c104239593ae931837157b8b" }
quick-xml = "0.42"
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
unicode-segmentation = "1"
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
log.workspace = true
rusqlite.workspace = true
plist = "1"
toml_edit = "0.25.17"
flate2 = "1"

libc = "0.2"

[target.'cfg(unix)'.dependencies]
futures.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
resvg = "=0.49.0"
